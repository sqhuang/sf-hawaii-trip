<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Route dots: SFO (orange) → HNL (blue) → ITO (red) -->
  <circle cx="120" cy="260" r="26" fill="#E8913A"/>
  <circle cx="256" cy="260" r="26" fill="#2E86AB"/>
  <circle cx="392" cy="260" r="26" fill="#A23B34"/>
  <!-- Connecting arcs -->
  <path d="M 120 260 Q 188 180 256 260" stroke="#E8913A" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 256 260 Q 324 180 392 260" stroke="#2E86AB" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
  <!-- Labels -->
  <g font-family="'PingFang SC','Helvetica Neue',sans-serif" font-size="36" font-weight="700" fill="#f5f5f0" text-anchor="middle">
    <text x="120" y="340">SFO</text>
    <text x="256" y="340">HNL</text>
    <text x="392" y="340">ITO</text>
  </g>
  <text x="256" y="180" font-family="'PingFang SC','Helvetica Neue',sans-serif" font-size="38" font-weight="300" fill="#f5f5f0" text-anchor="middle" letter-spacing="4">2026 · 5月</text>
</svg>
